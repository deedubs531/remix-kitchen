<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remix Kitchen</title>
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Remix Kitchen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first, four-step flow (Choose → Recipes → Groceries → Prep) with a sticky step bar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18302b; --muted:#5d6f69; --line:#d9e1dc;
  --accent:#d98e04; --accent-ink:#3a2600; --accent-soft:#fbefd4; --good:#2f7d5b; --good-soft:#e2f1e9;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a18; --surface:#182522; --ink:#e7efeb; --muted:#9aaca5; --line:#2a3a36;
  --accent:#f2ae2e; --accent-ink:#1f1500; --accent-soft:#3a2c10; --good:#5fc195; --good-soft:#18352a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a18; --surface:#182522; --ink:#e7efeb; --muted:#9aaca5; --line:#2a3a36;
  --accent:#f2ae2e; --accent-ink:#1f1500; --accent-soft:#3a2c10; --good:#5fc195; --good-soft:#18352a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h1{font-size:1.7rem;line-height:1.1}
.top .actions{display:flex;gap:6px;flex:0 0 auto}

/* extension popup: fixed phone-sized window */
html.popup body{width:400px;min-height:560px;padding-block:8px 24px}
html.popup .top p{display:none}
html.popup .top h1{font-size:1.4rem}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}

/* step bar */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:600;color:var(--muted)}
.step .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.step[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done{color:var(--good)}
.step.done .num{background:var(--good-soft);border-color:var(--good)}
.step:disabled{opacity:.45;cursor:not-allowed}

.panel{display:flex;flex-direction:column;gap:14px}
.intro{margin:0;color:var(--muted);font-size:.92rem}
.label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* choose */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--muted)}
.card[aria-pressed="true"]{border:2.5px solid var(--accent);padding:15px;background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 6px no-repeat,var(--surface)}
.card h3{font-size:1.18rem;line-height:1.2;padding-right:70px}
.card .why{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.card .badge{position:absolute;top:14px;right:14px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:6px}
.card .tag{font-size:.74rem;font-weight:600;color:var(--good)}

.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cta p{margin:0;font-size:.9rem;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:.85rem}

/* recipes */
.kit-head{display:flex;flex-direction:column;gap:6px}
.kit-head h2{font-size:1.45rem}
.kit-head p{margin:0;color:var(--muted);font-size:.92rem}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.meal{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .n{font-family:var(--display);color:var(--accent);font-size:1.1rem;line-height:1.3;font-variant-numeric:tabular-nums}
.meal h4{margin:0;font-size:1rem}
.meal p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.meal.picked{background:var(--accent-soft);margin-inline:-14px;padding-inline:14px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.src a{color:var(--ink);font-weight:600}
.src .by{font-size:.85rem;color:var(--muted)}
.src .rating{font-size:.85rem;color:var(--good);font-weight:600}
.src p{margin:4px 0 0;font-size:.9rem}
.note{font-size:.88rem;color:var(--muted);margin:0}

/* groceries + prep */
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good);flex:0 0 auto}
.check span{min-width:0}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.flag{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:5px}
.copybar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.copybar .count{font-size:.9rem;font-weight:600}
#copyText{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
.prep-step{display:grid;grid-template-columns:auto 1fr;gap:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flag{color:var(--accent)}}
:root[data-theme="dark"] .flag{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Remix Kitchen</h1>
      <p>Pick a kit, shop once, prep once, then remix it into five different 10-minute dinners. All lactose-free.</p>
    </div>
    <div class="actions">
      <button class="btn small" id="install" hidden>Install app</button>
      <button class="btn small" id="openTab" hidden>Open in tab ↗</button>
    </div>
  </header>

  <nav class="steps" aria-label="Steps">
    <button class="step" data-step="choose" id="s-choose"><span class="num">1</span>Choose</button>
    <button class="step" data-step="recipes" id="s-recipes"><span class="num">2</span>Recipes</button>
    <button class="step" data-step="shop" id="s-shop"><span class="num">3</span>Groceries</button>
    <button class="step" data-step="prep" id="s-prep"><span class="num">4</span>Prep</button>
  </nav>

  <main id="panel" class="panel"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
