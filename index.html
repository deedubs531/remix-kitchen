<style>
/* Layout: phone-first, four-step flow (Choose → Recipes → Groceries → Prep) with a sticky step bar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18302b; --muted:#5d6f69; --line:#d9e1dc;
  --accent:#d98e04; --accent-ink:#3a2600; --accent-soft:#fbefd4; --good:#2f7d5b; --good-soft:#e2f1e9;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a18; --surface:#182522; --ink:#e7efeb; --muted:#9aaca5; --line:#2a3a36;
  --accent:#f2ae2e; --accent-ink:#1f1500; --accent-soft:#3a2c10; --good:#5fc195; --good-soft:#18352a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a18; --surface:#182522; --ink:#e7efeb; --muted:#9aaca5; --line:#2a3a36;
  --accent:#f2ae2e; --accent-ink:#1f1500; --accent-soft:#3a2c10; --good:#5fc195; --good-soft:#18352a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top h1{font-size:1.7rem;line-height:1.1}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}

/* step bar */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:600;color:var(--muted)}
.step .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.step[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done{color:var(--good)}
.step.done .num{background:var(--good-soft);border-color:var(--good)}
.step:disabled{opacity:.45;cursor:not-allowed}

.panel{display:flex;flex-direction:column;gap:14px}
.intro{margin:0;color:var(--muted);font-size:.92rem}
.label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* choose */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--muted)}
.card[aria-pressed="true"]{border:2.5px solid var(--accent);padding:15px;background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 6px no-repeat,var(--surface)}
.card h3{font-size:1.18rem;line-height:1.2;padding-right:70px}
.card .why{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.card .badge{position:absolute;top:14px;right:14px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:6px}
.card .tag{font-size:.74rem;font-weight:600;color:var(--good)}

.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cta p{margin:0;font-size:.9rem;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:.85rem}

/* recipes */
.kit-head{display:flex;flex-direction:column;gap:6px}
.kit-head h2{font-size:1.45rem}
.kit-head p{margin:0;color:var(--muted);font-size:.92rem}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.meal{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .n{font-family:var(--display);color:var(--accent);font-size:1.1rem;line-height:1.3;font-variant-numeric:tabular-nums}
.meal h4{margin:0;font-size:1rem}
.meal p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.meal.picked{background:var(--accent-soft);margin-inline:-14px;padding-inline:14px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.src a{color:var(--ink);font-weight:600}
.src .by{font-size:.85rem;color:var(--muted)}
.src .rating{font-size:.85rem;color:var(--good);font-weight:600}
.src p{margin:4px 0 0;font-size:.9rem}
.note{font-size:.88rem;color:var(--muted);margin:0}

/* groceries + prep */
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good);flex:0 0 auto}
.check span{min-width:0}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.flag{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:5px}
.copybar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.copybar .count{font-size:.9rem;font-weight:600}
#copyText{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
.prep-step{display:grid;grid-template-columns:auto 1fr;gap:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flag{color:var(--accent)}}
:root[data-theme="dark"] .flag{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Remix Kitchen</h1>
    <p>Pick a kit, shop once, prep once, then remix it into five different 10-minute dinners. All lactose-free.</p>
  </header>

  <nav class="steps" aria-label="Steps">
    <button class="step" data-step="choose" id="s-choose"><span class="num">1</span>Choose</button>
    <button class="step" data-step="recipes" id="s-recipes"><span class="num">2</span>Recipes</button>
    <button class="step" data-step="shop" id="s-shop"><span class="num">3</span>Groceries</button>
    <button class="step" data-step="prep" id="s-prep"><span class="num">4</span>Prep</button>
  </nav>

  <main id="panel" class="panel"></main>
</div>
<div class="toast" id="toast" hidden></div>

  meals:[{n:"Sushi bowl", h:"Rice, flaked salmon, pickled cucumber, avocado, spicy mayo, nori."},

         {n:"Onigirazu", h:"Rice sandwich: nori, rice, salmon, cucumber, folded and cut in half."}],
  shop:[{i:"1.5 lb salmon fillets"},{i:"Soy sauce, mirin, sake (or dry sherry), sugar"},{i:"Sushi rice, rice vinegar"},{i:"Nori sheets"},{i:"Cucumbers, carrots, scallions, 2 avocados"},{i:"Frozen edamame, eggs"},{i:"Mayo, sriracha, sesame seeds"}],
  tip:"Cooked salmon keeps about 3 days, so eat the salmon meals first and save fried rice for later in the week."},

{ id:"moroccan", name:"Moroccan Lentil Soup", tag:"4.88★ · cosy",

  sources:[{title:"Moroccan Spiced Lentil & Chickpea Soup", by:"Niki Webster · Rebel Recipes", rating:"4.88★ from 32 votes", url:"https://www.rebelrecipes.com/moroccan-spiced-lentil-chickpea-soup/", note:"Vegan, about 45 minutes, with a lemony tahini dressing."},

  prep:["Make a double pot of soup (about 45 min)","Roast a cubed squash at 425°F for 30 min","Mix tahini dressing: tahini, lemon, water, salt","Roast a can of chickpeas until crispy","Cook couscous or rice"],
  meals:[{n:"Soup & tahini", h:"Bowl of soup with tahini drizzle and cilantro."},
         {n:"Stew over couscous", h:"Simmer soup down for 3 minutes until thick, spoon over couscous."},
         {n:"Squash bowl", h:"Soup over roasted squash with crispy chickpeas on top."},

  shop:[{i:"Red split lentils, 2 cans chickpeas"},{i:"Onion, garlic, celery, carrots, tomatoes"},{i:"Cumin seeds, cinnamon, turmeric, smoked paprika"},{i:"Harissa paste, vegetable stock"},{i:"Tahini, lemons, cilantro"},{i:"1 squash (butternut or honeynut)"},{i:"Couscous, pita, eggs"}]},

{ id:"gochujang", name:"Gochujang Chicken Bowls", tag:"Spicy & fast",
  why:"Something new for when Mediterranean feels samey. Same bowl format as your sushi orders, with a sweet-spicy kick and no dairy.",
  sources:[{title:"Sweet and Spicy Gochujang Chicken Bowls", by:"Monique Volz · Ambitious Kitchen", url:"https://www.ambitiouskitchen.com/?p=87258", note:"One pan, 30 minutes. Readers praise the sauce and how much can be prepped ahead."},
           {title:"Spicy Gochujang Ground Chicken Bowls", by:"Fit Foodie Finds", url:"https://fitfoodiefinds.com/ground-chicken-bowls", note:"Borrow the crunchy slaw; readers double it for lunches."}],
  prep:["Cook the gochujang chicken (30 min)","Make the slaw: shredded cabbage, carrot, rice vinegar, sesame oil","Cook a big pot of jasmine rice","Slice cucumber and scallions","Boil 3 eggs to jammy"],
  meals:[{n:"Classic bowl", h:"Rice, chicken, slaw, cucumber, sesame seeds."},
         {n:"Lettuce wraps", h:"Butter lettuce cups with chicken, slaw and scallions."},
         {n:"Crispy rice bowl", h:"Press cold rice into a hot oiled pan for 5 min, top with chicken and an egg."},
         {n:"Gochujang noodles", h:"Toss cooked noodles with chicken, sesame oil and a splash of soy."},
         {n:"Slaw salad", h:"Big pile of slaw, chicken, cucumber, peanuts, lime."}],
  shop:[{i:"1 lb ground chicken (or turkey)"},{i:"Gochujang, soy sauce, honey, sesame oil, rice vinegar"},{i:"Garlic, ginger, scallions"},{i:"Half a cabbage, carrots, cucumbers, butter lettuce"},{i:"Jasmine rice, noodles, eggs"},{i:"Sesame seeds, peanuts, limes"}]}
];

const CAT = {stew:"Plant-based",goddess:"Plant-based",garlic:"Plant-based",bulgogi:"Plant-based",miso:"Plant-based",curry:"Plant-based",moroccan:"Plant-based",shawarma:"Chicken",gochujang:"Chicken",salmon:"Fish"};
const HERO = {stew:["Chickpeas","Coconut","Greens"],goddess:["Baby bella","Eggplant","Tofu","Kale"],garlic:["Japanese eggplant","Pressed tofu","Shiitake"],bulgogi:["King oyster","Spinach","Kimchi"],miso:["Eggplant","Shiitake","Tofu"],curry:["Red lentils","Sweet potato","Spinach"],moroccan:["Lentils","Chickpeas","Squash"],shawarma:["Chicken thighs","Tahini","Sweet potato"],gochujang:["Ground chicken","Cabbage slaw"],salmon:["Salmon","Sushi rice","Avocado"]};
const STEPS = ["choose","recipes","shop","prep"];
const CUISINE = {stew:"Middle Eastern-inspired",goddess:"Mediterranean grain bowl",garlic:"Chinese",bulgogi:"Korean",miso:"Japanese",curry:"Indian-inspired",moroccan:"Moroccan",shawarma:"Middle Eastern",gochujang:"Korean",salmon:"Japanese"};

const store = { get(k,d){try{const v=localStorage.getItem("rk2_"+k);return v?JSON.parse(v):d}catch(e){return d}},
                set(k,v){try{localStorage.setItem("rk2_"+k,JSON.stringify(v))}catch(e){}} };
let S = store.get("state",{kit:null,step:"choose",filter:"All",per:{}});
let showCopy=false, pick=null;
const $ = id=>document.getElementById(id);
const kit = ()=>KITS.find(k=>k.id===S.kit)||null;
const per = ()=> (S.per[S.kit] ||= {have:[],prep:[]});
const save = ()=>store.set("state",S);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
const needList = ()=>{const k=kit(),p=per();return k.shop.map((x,i)=>({...x,i})).filter(x=>!p.have.includes(x.i))};

function go(step){S.step=step;showCopy=false;render();window.scrollTo({top:0,behavior:"smooth"})}

function render(){
  const k=kit();
  STEPS.forEach((s,i)=>{const b=$("s-"+s);b.disabled=!k&&s!=="choose";
    b.setAttribute("aria-current",S.step===s?"step":"false");
    b.classList.toggle("done",STEPS.indexOf(S.step)>i)});
  const P=$("panel");
  if(S.step!=="choose"&&!k){S.step="choose"}
  if(S.step==="choose"){
    const cats=["All","Plant-based","Chicken","Fish"];
    const list=KITS.filter(x=>S.filter==="All"||CAT[x.id]===S.filter);
    P.innerHTML=`<p class="intro">Each kit is one grocery shop and one weekend prep session that turns into five different dinners. Tap one to see its recipes.</p>
      <div class="filters">${cats.map(c=>`<button class="filter" data-filter="${c}" aria-pressed="${S.filter===c}">${c}</button>`).join("")}</div>
      ${k?`<div class="cta"><p>Selected: <b>${esc(k.name)}</b></p><button class="btn primary" data-go="recipes">See the recipes →</button></div>`:""}
      <div class="grid">${list.map(x=>`<button class="card" data-kit="${x.id}" aria-pressed="${x.id===S.kit}">
        ${x.id===S.kit?`<span class="badge">Selected</span>`:""}
        <span class="tag">${esc(CUISINE[x.id])}</span>
        <h3>${esc(x.name)}</h3>
        <p class="why">${esc(x.why)}</p>
        <span class="meta">${(HERO[x.id]||[]).map(h=>`<span class="chip">${esc(h)}</span>`).join("")}</span>
      </button>`).join("")}</div>`;
  } else if(S.step==="recipes"){
    P.innerHTML=`<div class="kit-head"><span class="label">${esc(CUISINE[k.id])}</span><h2>${esc(k.name)}</h2><p>${esc(k.why)}</p></div>
      <span class="label">Five remixes</span>
      <div class="list">${k.meals.map((m,i)=>`<div class="meal ${pick===i?"picked":""}"><span class="n">${i+1}</span><div><h4>${esc(m.n)}</h4><p>${esc(m.h)}</p></div></div>`).join("")}</div>
      <div class="cta"><p>Too tired to decide tonight?</p><button class="btn small" id="pickOne">Pick one for me</button></div>
      <span class="label">Base recipes</span>
      ${k.sources.map(s=>`<div class="src"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)} ↗</a><span class="by">${esc(s.by)}</span><p>${esc(s.note)}</p></div>`).join("")}
      ${k.tip?`<p class="note">${esc(k.tip)}</p>`:""}
      <div class="cta"><p>Happy with these?</p><button class="btn primary" data-go="shop">Build grocery list →</button></div>`;
  } else if(S.step==="shop"){
    const p=per(), need=needList();
    P.innerHTML=`<div class="kit-head"><span class="label">${esc(k.name)}</span><h2>Grocery list</h2><p>Tick off anything you already have at home. Then copy what's left into your notes or shopping app.</p></div>
      <div class="list">${k.shop.map((x,i)=>`<label class="check"><input type="checkbox" id="have-${k.id}-${i}" data-have="${i}" ${p.have.includes(i)?"checked":""}><span>${esc(x.i)}${x.f?`<span class="flag">${esc(x.f)}</span>`:""}</span></label>`).join("")}</div>
      <div class="copybar"><span class="count">${need.length} item${need.length===1?"":"s"} to buy</span>
        <span class="row" style="display:flex;gap:8px;flex-wrap:wrap">${p.have.length?`<button class="btn small" id="clearHave">Untick all</button>`:""}<button class="btn primary" id="copy" ${need.length?"":"disabled"}>Copy list</button></span></div>
      ${showCopy?`<label class="label" for="copyText">Select all and copy</label><textarea id="copyText" readonly>${esc(listText())}</textarea>`:""}
      <div class="cta"><p>Got your groceries?</p><button class="btn primary" data-go="prep">Prep plan →</button></div>`;
  } else {
    const p=per();
    const done=p.prep.length;
    P.innerHTML=`<div class="kit-head"><span class="label">${esc(k.name)}</span><h2>Prep plan</h2><p>Do this when you have about 1½ hours, usually Sunday. After that, every dinner is about 10 minutes of putting things together.</p></div>
      <span class="label">${done} of ${k.prep.length} done</span>
      <div class="list">${k.prep.map((x,i)=>`<label class="check"><input type="checkbox" id="pr-${k.id}-${i}" data-prep="${i}" ${p.prep.includes(i)?"checked":""}><span>${esc(x)}</span></label>`).join("")}</div>
      <p class="note">Store each part in its own container. Keep sauces and greens separate until you eat, so nothing goes soggy.</p>
      <div class="cta"><p>${done===k.prep.length?"All prepped. Enjoy the week!":"Ready for a new week?"}</p><button class="btn" id="resetKit">Start this kit fresh</button></div>
      <div class="cta"><p>Want something different next week?</p><button class="btn primary" data-go="choose">Choose another kit</button></div>`;
  }
  save();
}
function listText(){const k=kit();return k.name+" groceries\n"+needList().map(x=>"- "+x.i).join("\n")}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t||t.disabled)return;
  if(t.dataset.step){go(t.dataset.step);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.filter){S.filter=t.dataset.filter;render();return}
  if(t.dataset.kit){
    if(S.kit!==t.dataset.kit){S.kit=t.dataset.kit;pick=null}
    go("recipes");return}
  if(t.id==="pickOne"){const k=kit();let i;do{i=Math.floor(Math.random()*k.meals.length)}while(k.meals.length>1&&i===pick);pick=i;render();toast("Tonight: "+k.meals[i].n);return}
  if(t.id==="clearHave"){per().have=[];render();return}
  if(t.id==="copy"){
    const txt=listText();
    try{await navigator.clipboard.writeText(txt);toast("Copied "+needList().length+" items")}
    catch(err){showCopy=true;render();const ta=$("copyText");if(ta){ta.focus();ta.select()}toast("Select the text below and copy it")}
    return}
  if(t.id==="resetKit"){S.per[S.kit]={have:[],prep:[]};render();toast("Fresh start for this kit")}
});
document.addEventListener("change",e=>{
  const t=e.target,p=per();
  const tog=(arr,i)=>arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];
  if(t.dataset.have!==undefined){p.have=tog(p.have,+t.dataset.have);render()}
  if(t.dataset.prep!==undefined){p.prep=tog(p.prep,+t.dataset.prep);render()}
});
render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
